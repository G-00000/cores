<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Cores Aleatórias</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #FFFDD0;
        }
        #colorBox {
            width: 80%;
            height: 100px;
            border: 3px solid black;
            margin-bottom: 20px;
        }
        #questionButton {
            font-size: 24px;
            padding: 10px 20px;
            cursor: pointer;
        }
        #questionButton:focus {
            outline: 2px solid blue;
        }
        #questionButton:active {
            transform: scale(0.95);
        }
        #image {
            max-width: 100%;
            height: auto;
            margin-bottom: 20px;
            cursor: pointer;
        }
        #message {
            margin-top: 20px;
            font-weight: bold;
        }
        #apiSettings {
            margin: 20px;
            max-width: 480px;
        }
        #apiKey {
            box-sizing: border-box;
            width: 100%;
            padding: 8px;
            margin-top: 8px;
        }
        #questionButton:disabled {
            cursor: wait;
        }
    </style>
</head>
<body>
    <img id="image" src="imagem1.png" alt="Imagem Clicável" onclick="changeImage()">
    <div id="colorBox"></div>
    <button id="questionButton" onclick="generateColor()" tabindex="0">?</button>
    <div id="message" role="status" aria-live="polite">Gerador de Cores</div>
    <details id="apiSettings" open>
        <summary>Acesso ao ANU Quantum Numbers</summary>
        <p>O novo serviço quântico da ANU exige uma chave de acesso.
            <a href="https://quantumnumbers.anu.edu.au/" target="_blank" rel="noopener noreferrer">Criar uma chave na ANU</a>.</p>
        <label for="apiKey">Chave de acesso da ANU</label>
        <input id="apiKey" type="password" autocomplete="off" spellcheck="false" autocapitalize="none">
        <p id="keyStorageInfo">A chave fica guardada neste navegador e é enviada diretamente à ANU.
            Para a remover, apaga o conteúdo do campo.</p>
    </details>

    <script>
        let requestPending = false;
        let currentImageIndex = 1;
        const totalImages = 3; // Defina aqui o número total de imagens
        const apiKeyStorageName = 'cores.anuApiKey';
        const apiKeyInput = document.getElementById('apiKey');

        function saveApiKey() {
            try {
                const key = apiKeyInput.value.trim();
                if (key) {
                    localStorage.setItem(apiKeyStorageName, key);
                } else {
                    localStorage.removeItem(apiKeyStorageName);
                }
            } catch {
                document.getElementById('keyStorageInfo').textContent =
                    'O navegador impediu guardar a chave. Podes usá-la nesta página, mas terás de a introduzir novamente ao recarregar.';
            }
        }

        try {
            apiKeyInput.value = localStorage.getItem(apiKeyStorageName) || '';
        } catch {
            document.getElementById('keyStorageInfo').textContent =
                'O navegador impediu guardar a chave. Podes usá-la nesta página, mas terás de a introduzir novamente ao recarregar.';
        }
        apiKeyInput.addEventListener('input', saveApiKey);

        function changeImage() {
            currentImageIndex = (currentImageIndex % totalImages) + 1;
            document.getElementById('image').src = `imagem${currentImageIndex}.png`;
        }

        function updateMessage(text) {
            document.getElementById('message').textContent = text;
        }

        async function generateColor() {
            if (requestPending) return;
            const apiKey = document.getElementById('apiKey').value.trim();
            saveApiKey();
            if (!apiKey) {
                document.getElementById('apiSettings').open = true;
                document.getElementById('apiKey').focus();
                updateMessage('Introduz a chave de acesso da ANU para gerar uma cor.');
                return;
            }

            requestPending = true;
            const button = document.getElementById('questionButton');
            button.disabled = true;
            updateMessage('A obter um número quântico…');
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 10000);
            try {
                const response = await fetch('https://api.quantumnumbers.anu.edu.au?length=1&type=uint8', {
                    headers: { 'x-api-key': apiKey },
                    signal: controller.signal,
                    cache: 'no-store'
                });
                if (response.status === 401 || response.status === 403) {
                    document.getElementById('apiSettings').open = true;
                    throw new Error('A ANU recusou o acesso. Verifica a chave e o estado da conta na ANU.');
                }
                if (response.status === 429) {
                    throw new Error('Limite de pedidos da ANU atingido. Tenta mais tarde ou verifica a quota na ANU.');
                }
                if (!response.ok) {
                    throw new Error('O serviço quântico da ANU está indisponível. Tenta novamente mais tarde.');
                }
                let data;
                try {
                    data = await response.json();
                } catch {
                    throw new Error('A ANU devolveu uma resposta inválida. Tenta novamente mais tarde.');
                }
                if (data?.success !== true || data.type !== 'uint8' ||
                    (data.length !== 1 && data.length !== '1') ||
                    !Array.isArray(data.data) || data.data.length !== 1 ||
                    !Number.isInteger(data.data[0]) || data.data[0] < 0 || data.data[0] > 255) {
                    throw new Error('A ANU não devolveu um número válido entre 0 e 255. Tenta novamente.');
                }
                const number = data.data[0];
                let sum = String(number).split('').reduce((a, b) => parseInt(a) + parseInt(b), 0);
                while (sum > 9) {
                    sum = String(sum).split('').reduce((a, b) => parseInt(a) + parseInt(b), 0);
                }
                let color, colorName;
                switch(sum) {
                    case 0:
                        color = 'blue';
                        colorName = 'Azul';
                        break;
                    case 1:
                    case 2:
                        color = 'red';
                        colorName = 'Vermelho';
                        break;
                    case 3:
                    case 5:
                    case 6:
                        color = 'gray';
                        colorName = 'Cinzento';
                        break;
                    case 4:
                    case 7:
                        color = 'yellow';
                        colorName = 'Amarelo';
                        break;
                    case 8:
                    case 9:
                        color = 'green';
                        colorName = 'Verde';
                        break;
                }
                document.getElementById('colorBox').style.backgroundColor = color;
                updateMessage(colorName);
            } catch (error) {
                if (error.name === 'AbortError') {
                    updateMessage('A ANU demorou demasiado a responder. Tenta novamente.');
                } else if (error instanceof TypeError) {
                    updateMessage('Não foi possível contactar a ANU. Verifica a ligação e tenta novamente.');
                } else {
                    updateMessage(error.message);
                }
            } finally {
                clearTimeout(timeout);
                requestPending = false;
                button.disabled = false;
            }
        }
    </script>
</body>
</html>
